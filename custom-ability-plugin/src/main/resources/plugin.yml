name: CustomAbility
version: 1.0.0
api-version: '26.2'
main: net.lstonstudios.customability.CustomAbilityPlugin
author: LstonStudios
description: Right-click ability items for combat, defense and movement.
commands:
  customability:
    description: Give ability items to players.
    usage: /customability <player|selector> <ability|all> [amount]
    aliases: [cability]
    permission: customability.admin
permissions:
  customability.admin:
    description: Allows giving ability items.
    default: op

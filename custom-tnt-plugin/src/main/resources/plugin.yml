name: CustomTNT
version: 1.0.0
main: net.lstonstudios.customtnt.CustomTNTPlugin
api-version: '26.2'
author: LstonStudios
description: Adds themed nuke, mining, fire, slime, rdm, and black hole TNT.
depend: [WorldGuard]
commands:
  customtnt:
    description: Give custom TNT to players.
    usage: /customtnt <player|selector> <type|all> [amount]
    aliases: [ctnt]
    permission: customtnt.admin
  rldcustomtnt:
    description: Reload the custom TNT configuration.
    usage: /rldcustomtnt
    permission: customtnt.admin
permissions:
  customtnt.admin:
    description: Allows managing custom TNT.
    default: op

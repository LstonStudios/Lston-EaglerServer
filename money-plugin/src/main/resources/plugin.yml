name: Money
version: 1.0.0
api-version: '26.2'
main: net.lstonstudios.money.MoneyPlugin
author: LstonStudios
description: Earn money by mining and killing, then spend it in shops.
commands:
  balance:
    description: Show a player's balance.
    usage: /balance [player]
  pay:
    description: Send money to players; admins can grant money.
    usage: /pay <player|selector> <amount>
  sell:
    description: Sell items from your main hand.
    usage: /sell [amount]
  sinfo:
    aliases: [serverinfo]
    description: Get a server guide paper.
    usage: /sinfo
  cshop:
    description: Buy custom items; admins can edit custom shops.
    usage: /cshop [1-5] [view|section <color> <name>|rename <name>|setblock|delblock]
  shop:
    description: Buy individual items from the shop.
    usage: /shop [1-6]
  kit:
    description: Buy shulker box kits full of gear, weapons and food (1-5).
    usage: /kit [1-5]
  login:
    description: Admins sign in (or set a password the first time).
    usage: /login <password> [new-password]
  admin:
    description: Make a player an admin (can only ban, kick, mute, timeout, teleport and change gamemodes).
    usage: /admin <player>
    permission: money.admin
  op:
    description: Make a player an op (full control).
    usage: /op <player>
    permission: money.admin
  deadmin:
    description: Remove a player's admin status.
    usage: /deadmin <player>
    permission: money.admin
  deop:
    description: Remove a player's op status.
    usage: /deop <player>
    permission: money.admin
  permhelp:
    description: List the commands you can use as staff.
    usage: /permhelp
  unban:
    description: Unban a player or IP.
    usage: /unban <player|ip>
    permission: money.moderate
  mute:
    description: Stop a player from chatting.
    usage: /mute <player> [reason]
    permission: money.moderate
  unmute:
    description: Let a muted player chat again.
    usage: /unmute <player>
    permission: money.moderate
  timeout:
    description: Freeze and silence a player for a number of minutes.
    usage: /timeout <player> <minutes|off> [reason]
    permission: money.moderate
  bankrupt:
    description: Reset a player's balance to zero.
    usage: /bankrupt <player>
    permission: money.admin
  mreload:
    description: Reload the money configuration from the server console.
    usage: mreload
permissions:
  money.admin:
    description: Allows granting money and managing shop blocks.
    default: op
  money.moderate:
    description: Allows muting and timing out players.
    default: op

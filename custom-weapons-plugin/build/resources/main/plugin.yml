name: CustomWeapons
version: 1.0.0
api-version: '26.2'
main: net.lstonstudios.customweapons.CustomWeaponsPlugin
author: LstonStudios
description: Adds the Wind Burst.
commands:
  weapon:
    description: Give Wind Bursts.
    usage: /weapon <player|@a|@s|@p> <wind|all> [amount]
    permission: customweapons.admin
permissions:
  customweapons.admin:
    description: Allows giving custom weapons.
    default: op
